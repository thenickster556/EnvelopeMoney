plugins {
    id 'com.android.application'
    id 'jacoco'
}

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.example.envelopemoney"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.camera:camera-core:1.2.3'
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.+'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Instrument the reusable recovery implementation; emit a report and enforce the agreed minimum.
jacoco { toolVersion = '0.8.11' }
tasks.withType(Test).configureEach {
    jacoco {
        // Robolectric loads Android-facing classes without a conventional code-source location.
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}
def receiptRecoveryClasses = fileTree(dir: "$buildDir/intermediates/javac/debug/classes", includes: [
        '**/receipt/ReceiptReferenceResolver*.class', '**/receipt/ReceiptReferenceRepair*.class',
        '**/receipt/AndroidReceiptSource*.class'])
task receiptRecoveryCoverage(type: JacocoReport, dependsOn: 'testDebugUnitTest') {
    executionData file("$buildDir/jacoco/testDebugUnitTest.exec")
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(receiptRecoveryClasses)
    reports { xml.enabled true; html.enabled true }
}
task verifyReceiptRecoveryCoverage(type: JacocoCoverageVerification, dependsOn: 'receiptRecoveryCoverage') {
    executionData file("$buildDir/jacoco/testDebugUnitTest.exec")
    classDirectories.setFrom(receiptRecoveryClasses)
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.80 }
            limit { counter = 'BRANCH'; minimum = 0.80 }
        }
    }
}
